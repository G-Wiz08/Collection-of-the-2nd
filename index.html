<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#000;font-family:-apple-system,'SF Pro Display',BlinkMacSystemFont,sans-serif;color:#fff;height:100vh;overflow:hidden}
input,select,textarea{color-scheme:dark;font-family:inherit}
input::placeholder,textarea::placeholder{color:#48484a}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:#1c1c1e}
::-webkit-scrollbar-thumb{background:#3a3a3c;border-radius:3px}
@keyframes fadeIn{from{opacity:0;transform:scale(0.97)}to{opacity:1;transform:scale(1)}}
.sheet{animation:fadeIn 0.2s ease}
select{background:#2c2c2e;border:none;color:#fff;border-radius:12px;padding:13px 16px;font-size:16px;outline:none;appearance:none;-webkit-appearance:none;width:100%}
input[type=text],input[type=number],input[type=date],textarea{background:#2c2c2e;border:none;color:#fff;border-radius:12px;padding:13px 16px;font-size:16px;outline:none;width:100%}
textarea{resize:vertical;min-height:80px}
button{font-family:inherit;cursor:pointer}
.nav-btn{width:100%;padding:12px 15px;border-radius:13px;border:none;background:transparent;color:#8e8e93;font-weight:500;font-size:15px;display:flex;align-items:center;gap:9px;text-align:left;border-left:3px solid transparent;transition:all 0.15s}
.nav-btn.active{background:#ff9f0a18;color:#ff9f0a;font-weight:700;border-left-color:#ff9f0a}
.card{background:#1c1c1e;border-radius:16px;margin-bottom:9px;display:flex;align-items:center;gap:14px;padding:14px 18px;cursor:pointer;border:1px solid #2c2c2e}
.section-card{background:#1c1c1e;border-radius:16px;border:1px solid #2c2c2e;overflow:hidden;margin-bottom:12px}
.section-header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid #2c2c2e}
.pill{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;padding:3px 10px;border-radius:20px}
.toggle{width:44px;height:26px;border-radius:13px;border:none;cursor:pointer;position:relative;transition:background 0.2s;flex-shrink:0}
.toggle-knob{position:absolute;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left 0.2s}

function TI({value,onChange,placeholder}){return <input type="text" value={value||""} onChange={e=>onChange(e.target.value)} placeholder={placeholder||""}/>;}
function NI({value,onChange,placeholder}){return <input type="number" value={value||""} onChange={e=>onChange(e.target.value)} placeholder={placeholder||""}/>;}
function DI({value,onChange}){return <input type="date" value={value||""} onChange={e=>onChange(e.target.value)} style={{color:value?"#fff":"#636366"}}/>;}
function TA({value,onChange,placeholder}){return <textarea value={value||""} onChange={e=>onChange(e.target.value)} placeholder={placeholder||""}/>;}
function PI({value,onChange}){
  return (
    <div style={{position:"relative"}}>
      <span style={{position:"absolute",left:16,top:"50%",transform:"translateY(-50%)",color:"#8e8e93",pointerEvents:"none"}}>$</span>
      <input type="number" value={value||""} onChange={e=>onChange(e.target.value)} placeholder="0.00" min="0" step="0.01" style={{paddingLeft:26}}/>
    </div>
  );
}

const ADD_OPT="__ADD__";
function ASelect({value,onChange,options,onAdd}){
  const [adding,setAdding]=useState(false);
  const [draft,setDraft]=useState("");
  const ref=useRef();
  function handle(e){if(e.target.value===ADD_OPT){setAdding(true);setTimeout(()=>ref.current&&ref.current.focus(),50);}else onChange(e.target.value);}
  function commit(){const t=draft.trim();if(t){onAdd&&onAdd(t);onChange(t);}setDraft("");setAdding(false);}
  if(adding)return(
    <div style={{display:"flex",gap:8}}>
      <input ref={ref} type="text" value={draft} onChange={e=>setDraft(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")commit();if(e.key==="Escape"){setDraft("");setAdding(false);}}} placeholder="Type + Enter…" style={{flex:1,border:"1px solid #ff9f0a"}}/>
      <button onClick={commit} style={{background:"#ff9f0a",border:"none",borderRadius:10,padding:"11px 14px",color:"#000",fontWeight:700}}>Add</button>
      <button onClick={()=>{setDraft("");setAdding(false);}} style={{background:"#2c2c2e",border:"none",borderRadius:10,padding:"11px 12px",color:"#8e8e93"}}>✕</button>
    </div>
  );
  return(
    <select value={value||""} onChange={handle} style={{color:value?"#fff":"#636366"}}>
      <option value="" disabled>Select…</option>
      {options.map(o=><option key={o} value={o}>{o}</option>)}
      <option value={ADD_OPT}>＋ Add custom…</option>
    </select>
  );
}

function ImgPicker({images,onChange}){
  const imgs=images||[];
  const ref=useRef();
  function add(e){
    const files=Array.from(e.target.files);
    Promise.all(files.map(f=>new Promise(r=>{const rd=new FileReader();rd.onload=ev=>r(ev.target.result);rd.readAsDataURL(f);}))).then(ni=>onChange([...imgs,...ni]));
    e.target.value="";
  }
  function rm(i){onChange(imgs.filter((_,j)=>j!==i));}
  return(
    <div>
      {imgs.length>0&&(
        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:8}}>
          {imgs.map((src,i)=>(
            <div key={i} style={{position:"relative",width:90,height:90,borderRadius:10,overflow:"hidden"}}>
              <img src={src} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>
              <button onClick={()=>rm(i)} style={{position:"absolute",top:3,right:3,width:20,height:20,borderRadius:"50%",background:"rgba(0,0,0,0.75)",border:"none",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",padding:0}}><IX/></button>
            </div>
          ))}
          <div onClick={()=>ref.current.click()} style={{width:90,height:90,borderRadius:10,background:"#2c2c2e",border:"2px dashed #48484a",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",fontSize:24,color:"#636366"}}>+</div>
        </div>
      )}
      {!imgs.length&&(
        <div onClick={()=>ref.current.click()} style={{height:120,borderRadius:14,background:"#2c2c2e",border:"2px dashed #48484a",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",cursor:"pointer",gap:8}}>
          <div style={{color:"#636366"}}><ICamera/></div>
          <span style={{color:"#636366",fontSize:14}}>Add Photos</span>
        </div>
      )}
      <input ref={ref} type="file" accept="image/*" multiple style={{display:"none"}} onChange={add}/>
    </div>
  );
}

function PV({images,placeholder}){

// ── PBZ Calculator ────────────────────────────────────────────────────────────
function PBZCalculator({units}){
  const [v,setV]=useState({velocity:"2700",bc:"0.475",weight:"150",vitalSize:"8",scopeHeight:"1.5",zeroRange:"100"});
  const [result,setResult]=useState(null);
  const s=k=>e=>setV(x=>({...x,[k]:e.target.value}));

  function calculate(){
    const vel=parseFloat(v.velocity);
    const bc=parseFloat(v.bc);
    const wt=parseFloat(v.weight);
    const vital=parseFloat(v.vitalSize)/2; // radius
    const sh=parseFloat(v.scopeHeight);
    const zero=parseFloat(v.zeroRange);
    if(!vel||!bc||!wt||!vital)return;

    // Simplified ballistic drop calculation
    const distances=[0,50,100,150,200,250,300,350,400,450,500];
    const drops=[];
    const g=32.174; // ft/s²
    const velFps=vel;

    distances.forEach(d=>{
      const dFt=d*3; // yards to feet
      const tof=dFt/velFps*(1+(dFt/(bc*velFps*0.1))*0.5); // simplified
      const drop=0.5*g*tof*tof*12; // inches
      const lineOfSight=(sh)*(d/zero); // scope height adjustment
      const trajectory=lineOfSight-drop;
      drops.push({d,trajectory:trajectory.toFixed(1)});
    });

    // Find MPBR — max range where bullet stays within vital zone radius
    let mpbr=0;
    drops.forEach(({d,trajectory})=>{
      const t=parseFloat(trajectory);
      if(t>=-vital&&t<=vital)mpbr=d;
    });

    // Find PBZ near zero range
    const pbzZero=parseFloat(drops.find(x=>x.d===zero)?.trajectory||"0");

    setResult({drops,mpbr,pbzZero,vital});
  }

  const distUnit=units==="metric"?"m":"yds";
  const velUnit=units==="metric"?"m/s":"fps";

  return(
    <div>
      <div style={{background:"#1c1c1e",borderRadius:16,padding:"20px",marginBottom:16,border:"1px solid #2c2c2e"}}>
        <div style={{color:"#ff9f0a",fontSize:13,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:14}}>Bullet & Rifle Data</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12}}>
          {[["Muzzle Velocity ("+velUnit+")","velocity","2700"],["Ballistic Coeff (G1)","bc","0.475"],["Bullet Weight (gr)","weight","150"],["Vital Zone (in dia)","vitalSize","8"],["Scope Height (in)","scopeHeight","1.5"],["Zero Range ("+distUnit+")","zeroRange","100"]].map(([l,k,ph])=>(
            <div key={k}>
              <div style={{color:"#8e8e93",fontSize:11,fontWeight:600,textTransform:"uppercase",marginBottom:5}}>{l}</div>
              <input type="number" value={v[k]} onChange={s(k)} placeholder={ph} style={{background:"#2c2c2e",border:"none",borderRadius:10,padding:"10px 14px",color:"#fff",fontSize:15,outline:"none",width:"100%"}}/>
            </div>
          ))}
        </div>
        <button onClick={calculate} style={{marginTop:16,width:"100%",padding:"14px",borderRadius:12,background:"#ff9f0a",border:"none",color:"#000",fontSize:16,fontWeight:700}}>Calculate →</button>
      </div>

      {result&&(
        <>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
            <div style={{background:"#1c1c1e",borderRadius:14,padding:"16px 18px",border:"1px solid #30d15844"}}>
              <div style={{color:"#30d158",fontSize:26,fontWeight:800}}>{result.mpbr} {distUnit}</div>
              <div style={{color:"#636366",fontSize:12,fontWeight:600,marginTop:3}}>MAXIMUM POINT-BLANK RANGE</div>
              <div style={{color:"#8e8e93",fontSize:12,marginTop:6}}>Bullet stays within ±{result.vital}" of aim point</div>
            </div>
            <div style={{background:"#1c1c1e",borderRadius:14,padding:"16px 18px",border:"1px solid #ff9f0a44"}}>
              <div style={{color:"#ff9f0a",fontSize:26,fontWeight:800}}>{result.pbzZero}"</div>
              <div style={{color:"#636366",fontSize:12,fontWeight:600,marginTop:3}}>TRAJECTORY AT ZERO ({v.zeroRange} {distUnit})</div>
              <div style={{color:"#8e8e93",fontSize:12,marginTop:6}}>Positive = above line of sight</div>
            </div>
          </div>
          <div style={{background:"#1c1c1e",borderRadius:14,border:"1px solid #2c2c2e",overflow:"hidden"}}>
            <div style={{padding:"12px 16px",borderBottom:"1px solid #2c2c2e",display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              <span style={{color:"#8e8e93",fontSize:13,fontWeight:600}}>Distance ({distUnit})</span>
              <span style={{color:"#8e8e93",fontSize:13,fontWeight:600}}>Trajectory (in)</span>
            </div>
            {result.drops.map(({d,trajectory})=>{
              const t=parseFloat(trajectory);
              const inZone=Math.abs(t)<=result.vital;
              return(
                <div key={d} style={{padding:"10px 16px",borderBottom:"1px solid #2c2c2e",display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,background:inZone?"#0d1f0d":"transparent"}}>
                  <span style={{color:"#fff",fontSize:14}}>{d} {distUnit}</span>
                  <span style={{color:inZone?"#30d158":t>0?"#ff9f0a":"#ff453a",fontSize:14,fontWeight:600}}>{t>0?"+":""}{trajectory}"</span>
                </div>
              );
            })}
          </div>
        </>
      )}
    </div>
  );
}

// ── Shooting Games ────────────────────────────────────────────────────────────
function GamesView(){
  const [sel,setSel]=useState(null);
  const [gameState,setGameState]=useState(null);

  function startGame(game){
    setSel(game);
    if(game.scoring==="poker"){
      setGameState({players:[{name:"Player 1",hand:[]},{name:"Player 2",hand:[]}],currentPlayer:0,round:0});
    } else if(game.scoring==="points"){
      setGameState({players:[{name:"Player 1",score:0},{name:"Player 2",score:0}],currentScore:null,lastShooter:null});
    } else if(game.scoring==="streak"){
      setGameState({players:[{name:"Player 1",streak:0,locked:0}],currentStreak:0});
    } else if(game.scoring==="rounds"){
      setGameState({players:[{name:"Player 1",wins:0},{name:"Player 2",wins:0}],round:1,maxRounds:10});
    } else if(game.scoring==="time"){
      setGameState({players:[{name:"Player 1",time:null},{name:"Player 2",time:null}],timing:false,start:null});
    }
  }

  if(sel){
    return <GameSession game={sel} state={gameState} setState={setGameState} onBack={()=>{setSel(null);setGameState(null);}}/>;
  }

  return(
    <div>
      <div style={{color:"#8e8e93",fontSize:14,marginBottom:16}}>Select a game to read the rules and start tracking score.</div>
      {SHOOTING_GAMES.map(game=>(
        <div key={game.id} className="card" onClick={()=>setSel(game)}>
          <div style={{flex:1}}>
            <div style={{color:"#fff",fontWeight:700,fontSize:16}}>{game.name}</div>
            <div style={{color:"#636366",fontSize:13}}>{game.players} players</div>
          </div>
          <div style={{color:"#48484a"}}><IChev/></div>
        </div>
      ))}
    </div>
  );
}

function GameSession({game,state,setState,onBack}){
  const [tab,setTab]=useState("rules");
  const defaultCount = game.scoring==="streak"?1:game.scoring==="points"?2:2;
  const [playerNames,setPlayerNames]=useState(["Player 1","Player 2"]);
  const [scores,setScores]=useState({});
  const [streakCount,setStreakCount]=useState(0);
  const [lockedStreak,setLockedStreak]=useState(0);
  const [roundWins,setRoundWins]=useState({});
  const [times,setTimes]=useState({});
  const [penaltyInput,setPenaltyInput]=useState({});

  const maxPlayers = game.scoring==="poker"?6:game.scoring==="streak"?1:game.scoring==="points"?2:6;
  const minPlayers = game.scoring==="streak"?1:2;

  function addPlayer(){
    if(playerNames.length>=maxPlayers)return;
    setPlayerNames(p=>[...p,`Player ${p.length+1}`]);
  }
  function removePlayer(){
    if(playerNames.length<=minPlayers)return;
    const idx=playerNames.length-1;
    setPlayerNames(p=>p.slice(0,-1));
    setScores(s=>{const n={...s};delete n[idx];return n;});
    setRoundWins(s=>{const n={...s};delete n[idx];return n;});
    setTimes(s=>{const n={...s};delete n[idx];return n;});
    setPenaltyInput(s=>{const n={...s};delete n[idx];return n;});
  }

  return(
    <div style={{height:"100%",display:"flex",flexDirection:"column"}}>
      <div style={{display:"flex",alignItems:"center",padding:"0 0 16px",gap:14,borderBottom:"1px solid #2c2c2e",marginBottom:16}}>
        <button onClick={onBack} style={{background:"none",border:"none",color:"#ff9f0a",fontSize:16,fontWeight:600}}>‹ Games</button>
        <div style={{color:"#fff",fontWeight:700,fontSize:18,flex:1}}>{game.name}</div>
      </div>
      <div style={{display:"flex",gap:8,marginBottom:16,background:"#2c2c2e",borderRadius:12,padding:4}}>
        {[["rules","Rules"],["score","Scorekeeper"]].map(([k,l])=>(
          <button key={k} onClick={()=>setTab(k)} style={{flex:1,padding:"9px",borderRadius:9,border:"none",background:tab===k?"#ff9f0a":"transparent",color:tab===k?"#000":"#8e8e93",fontWeight:700,fontSize:14}}>{l}</button>
        ))}
      </div>

      {tab==="rules"&&(
        <div>
          <div style={{background:"#1c1c1e",borderRadius:14,padding:"16px",marginBottom:12,border:"1px solid #2c2c2e"}}>
            <div style={{color:"#ff9f0a",fontSize:12,fontWeight:700,textTransform:"uppercase",marginBottom:8}}>Overview</div>
            <div style={{color:"#e5e5ea",fontSize:15,lineHeight:"1.6"}}>{game.description}</div>
          </div>
          <div style={{background:"#1c1c1e",borderRadius:14,padding:"16px",border:"1px solid #2c2c2e"}}>
            <div style={{color:"#ff9f0a",fontSize:12,fontWeight:700,textTransform:"uppercase",marginBottom:12}}>Rules</div>
            {game.rules.map((r,i)=>(
              <div key={i} style={{display:"flex",gap:12,marginBottom:10}}>
                <div style={{width:22,height:22,borderRadius:"50%",background:"#ff9f0a22",color:"#ff9f0a",fontSize:12,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:1}}>{i+1}</div>
                <div style={{color:"#e5e5ea",fontSize:14,lineHeight:"1.6"}}>{r}</div>
              </div>
            ))}
          </div>
        </div>
      )}

      {tab==="score"&&(
        <div>
          {/* Generic score input for all games */}
          <div style={{background:"#1c1c1e",borderRadius:14,padding:"16px",marginBottom:12,border:"1px solid #2c2c2e"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
              <div style={{color:"#ff9f0a",fontSize:12,fontWeight:700,textTransform:"uppercase"}}>Players ({playerNames.length})</div>
              {game.scoring!=="streak"&&game.scoring!=="points"&&(
                <div style={{display:"flex",gap:8}}>
                  {playerNames.length>minPlayers&&<button onClick={removePlayer} style={{background:"#3a3a3c",border:"none",borderRadius:8,padding:"5px 12px",color:"#fff",fontSize:13,fontWeight:600}}>− Remove</button>}
                  {playerNames.length<maxPlayers&&<button onClick={addPlayer} style={{background:"#ff9f0a22",border:"1px solid #ff9f0a44",borderRadius:8,padding:"5px 12px",color:"#ff9f0a",fontSize:13,fontWeight:600}}>+ Add</button>}
                </div>
              )}
            </div>
            {playerNames.map((name,i)=>(
              <div key={i} style={{display:"flex",gap:10,marginBottom:10,alignItems:"center"}}>
                <span style={{color:"#636366",fontSize:14,width:24,flexShrink:0}}>P{i+1}</span>
                <input type="text" value={name} onChange={e=>{const n=[...playerNames];n[i]=e.target.value;setPlayerNames(n);}} style={{flex:1,background:"#2c2c2e",border:"none",borderRadius:10,padding:"10px 14px",color:"#fff",fontSize:15,outline:"none"}}/>
                {game.scoring==="time"&&(
                  <div style={{display:"flex",gap:8,alignItems:"center"}}>
                    <input type="number" value={times[i]||""} onChange={e=>{const t={...times};t[i]=e.target.value;setTimes(t);}} placeholder="secs" style={{width:80,background:"#2c2c2e",border:"none",borderRadius:10,padding:"10px 14px",color:"#fff",fontSize:15,outline:"none"}}/>
                    <input type="number" value={penaltyInput[i]||""} onChange={e=>{const p={...penaltyInput};p[i]=e.target.value;setPenaltyInput(p);}} placeholder="+pen" style={{width:70,background:"#2c2c2e",border:"none",borderRadius:10,padding:"10px 14px",color:"#ff453a",fontSize:15,outline:"none"}}/>
                  </div>
                )}
                {game.scoring==="rounds"&&(
                  <div style={{display:"flex",gap:8,alignItems:"center"}}>
                    <button onClick={()=>{const r={...roundWins};r[i]=(r[i]||0)+1;setRoundWins(r);}} style={{background:"#30d15822",border:"1px solid #30d15844",borderRadius:10,padding:"8px 14px",color:"#30d158",fontWeight:700,fontSize:14}}>+Win</button>
                    <span style={{color:"#fff",fontWeight:700,fontSize:18,minWidth:24,textAlign:"center"}}>{roundWins[i]||0}</span>
                  </div>
                )}
                {game.scoring==="points"&&(
                  <div style={{display:"flex",gap:8,alignItems:"center"}}>
                    <button onClick={()=>{const s={...scores};s[i]=(s[i]||0)+1;setScores(s);}} style={{background:"#ff9f0a22",border:"1px solid #ff9f0a44",borderRadius:10,padding:"8px 14px",color:"#ff9f0a",fontWeight:700}}>+Pt</button>
                    <span style={{color:"#fff",fontWeight:700,fontSize:18,minWidth:24,textAlign:"center"}}>{scores[i]||0}</span>
                  </div>
                )}
              </div>
            ))}
          </div>

          {game.scoring==="streak"&&(
            <div style={{background:"#1c1c1e",borderRadius:14,padding:"16px",border:"1px solid #2c2c2e"}}>
              <div style={{color:"#ff9f0a",fontSize:12,fontWeight:700,textTransform:"uppercase",marginBottom:12}}>Streak Tracker</div>
              <div style={{display:"flex",gap:12,marginBottom:16}}>
                <div style={{flex:1,background:"#2c2c2e",borderRadius:12,padding:"16px",textAlign:"center"}}>
                  <div style={{color:"#30d158",fontSize:36,fontWeight:800}}>{streakCount}</div>
                  <div style={{color:"#636366",fontSize:12,marginTop:4}}>CURRENT STREAK</div>
                </div>
                <div style={{flex:1,background:"#2c2c2e",borderRadius:12,padding:"16px",textAlign:"center"}}>
                  <div style={{color:"#ff9f0a",fontSize:36,fontWeight:800}}>{lockedStreak}</div>
                  <div style={{color:"#636366",fontSize:12,marginTop:4}}>LOCKED IN</div>
                </div>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
                <button onClick={()=>setStreakCount(v=>v+1)} style={{padding:"14px",borderRadius:12,background:"#30d15822",border:"1px solid #30d15844",color:"#30d158",fontWeight:700,fontSize:15}}>✓ Ten</button>
                <button onClick={()=>setStreakCount(0)} style={{padding:"14px",borderRadius:12,background:"#ff453a22",border:"1px solid #ff453a44",color:"#ff453a",fontWeight:700,fontSize:15}}>✗ Miss</button>
                <button onClick={()=>{setLockedStreak(streakCount);setStreakCount(0);}} style={{padding:"14px",borderRadius:12,background:"#ff9f0a22",border:"1px solid #ff9f0a44",color:"#ff9f0a",fontWeight:700,fontSize:15}}>🔒 Lock</button>
              </div>
            </div>
          )}

          {game.scoring==="time"&&(
            <div style={{background:"#1c1c1e",borderRadius:14,padding:"16px",border:"1px solid #2c2c2e"}}>
              <div style={{color:"#ff9f0a",fontSize:12,fontWeight:700,textTransform:"uppercase",marginBottom:12}}>Results (time + penalty seconds)</div>
              {Object.keys(times).length>0&&(
                <div>
                  {Object.entries(times).sort(([,a],[,b])=>{
                    const ta=parseFloat(a)+(parseFloat(penaltyInput[Object.keys(times).indexOf(Object.keys(times).find(k=>k===a))])||0);
                    const tb=parseFloat(b)+(parseFloat(penaltyInput[Object.keys(times).indexOf(Object.keys(times).find(k=>k===b))])||0);
                    return ta-tb;
                  }).map(([i,t],rank)=>{
                    const total=(parseFloat(t)||0)+(parseFloat(penaltyInput[i])||0);
                    return(
                      <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"10px 0",borderBottom:"1px solid #2c2c2e"}}>
                        <span style={{color:rank===0?"#ffd60a":"#fff",fontWeight:rank===0?700:400}}>{rank===0?"🥇 ":rank===1?"🥈 ":"🥉 "}{playerNames[i]||`Player ${parseInt(i)+1}`}</span>
                        <span style={{color:"#ff9f0a",fontWeight:700}}>{total.toFixed(1)}s</span>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          {(game.scoring==="points"||game.scoring==="rounds")&&(
            <div style={{background:"#1c1c1e",borderRadius:14,padding:"16px",border:"1px solid #2c2c2e",marginTop:12}}>
              <div style={{color:"#ff9f0a",fontSize:12,fontWeight:700,textTransform:"uppercase",marginBottom:12}}>Scoreboard</div>
              {playerNames.map((name,i)=>{
                const s=game.scoring==="points"?(scores[i]||0):(roundWins[i]||0);
                const max=10;
                return(
                  <div key={i} style={{marginBottom:12}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                      <span style={{color:"#fff",fontSize:14}}>{name}</span>
                      <span style={{color:"#ff9f0a",fontWeight:700}}>{s} / {max}</span>
                    </div>
                    <div style={{height:8,background:"#2c2c2e",borderRadius:4,overflow:"hidden"}}>
                      <div style={{height:"100%",width:`${(s/max)*100}%`,background:"#ff9f0a",borderRadius:4,transition:"width 0.3s"}}/>
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          <button onClick={()=>{setScores({});setRoundWins({});setTimes({});setPenaltyInput({});setStreakCount(0);setLockedStreak(0);}} style={{marginTop:16,width:"100%",padding:"14px",borderRadius:12,background:"#3a3a3c",border:"none",color:"#fff",fontSize:15,fontWeight:600}}>Reset Scores</button>
        </div>
      )}
    </div>
  );
}

// ── Gun Profile (Full View) ───────────────────────────────────────────────────
function GunProfile({gun,accessories,rangeSessions,zeros,maintenance,loads,hunts,ammo,guns,onClose,onEdit,onDelete,onAddAcc,onViewAcc,onAddZero,onAddSession,onAddMaint,settings,lists}){
  const [sections,setSections]=useState({info:true,accessories:true,zeros:true,range:true,maintenance:true,loads:false,hunts:false});

            {gun.action&&<div style={{color:"#636366",fontSize:13,marginBottom:8}}>{gun.action}</div>}
            <div style={{color:"#ff9f0a",fontSize:14,fontWeight:600,marginBottom:12}}>{gun.caliber}</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              {[["Rounds Fired",totalRounds],["Accessories",gunAcc.length],["Sessions",gunSessions.length],["Zeros",gunZeros.length]].map(([l,v])=>(
                <div key={l} style={{background:"#2c2c2e",borderRadius:10,padding:"10px 12px"}}>
                  <div style={{color:"#ff9f0a",fontSize:18,fontWeight:800}}>{v}</div>

function App(){

  const [acc,setAcc]=useState(SAMPLE_ACC);
  const [rangeSessions,setRangeSessions]=useState([]);
  const [zeros,setZeros]=useState([]);
  const [maintenance,setMaintenance]=useState([]);
  const [loads,setLoads]=useState([]);
  const [hunts,setHunts]=useState([]);
  const [settings,setSettings]=useState(DEFAULT_SETTINGS);
  const [search,setSearch]=useState("");
  const [modal,setModal]=useState(null);
  const [sel,setSel]=useState(null);
  const [showAdd,setShowAdd]=useState(false);
  const [showExport,setShowExport]=useState(false);

  const [calibers,setCalibersL]=useState(CALIBERS);
  const [gunTypes,setGunTypesL]=useState(GUN_TYPES);
  const [actions,setActionsL]=useState(ACTIONS);
  const [mfgGuns,setMfgGunsL]=useState(MFG_GUNS);
  const [mfgAmmo,setMfgAmmoL]=useState(MFG_AMMO);
  const [mfgAcc,setMfgAccL]=useState(MFG_ACC);
  const [ammoTypes,setAmmoTypesL]=useState(AMMO_TYPES);
  const [accCats,setAccCatsL]=useState(ACC_CATS);
  function addTo(fn){return v=>fn(p=>p.includes(v)?p:[...p,v]);}
  const lists={calibers,gunTypes,actions,mfgGuns,mfgAmmo,mfgAcc,ammoTypes,accCats,addCaliber:addTo(setCalibersL),addGunType:addTo(setGunTypesL),addAction:addTo(setActionsL),addMfgGun:addTo(setMfgGunsL),addMfgAmmo:addTo(setMfgAmmoL),addMfgAcc:addTo(setMfgAccL),addAmmoType:addTo(setAmmoTypesL),addAccCat:addTo(setAccCatsL)};

  const totalRounds=ammo.reduce((s,a)=>s+(parseInt(a.quantity)||0),0);
  const totalInvested=[...guns,...ammo,...acc].reduce((s,x)=>s+(parseFloat(x.purchasePrice)||0),0);
  const q=search.toLowerCase();
  const fGuns=guns.filter(g=>`${g.manufacturer} ${g.model} ${g.serialNumber} ${g.caliber}`.toLowerCase().includes(q));
  const fAmmo=ammo.filter(a=>`${a.manufacturer} ${a.caliber} ${a.ammoType}`.toLowerCase().includes(q));
  const fAcc=acc.filter(a=>`${a.manufacturer} ${a.model} ${a.category}`.toLowerCase().includes(q));

  function saveGun(f){if(modal==="editGun")setGuns(gs=>gs.map(g=>g.id===sel.id?{...g,...f}:g));else setGuns(gs=>[...gs,{...f,id:uid(),type:"firearm",dateAdded:nowDate(),roundCount:0}]);setModal(null);}
  function saveAmmo(f){if(modal==="editAmmo")setAmmo(as=>as.map(a=>a.id===sel.id?{...a,...f}:a));else setAmmo(as=>[...as,{...f,id:uid(),type:"ammo",dateAdded:nowDate()}]);setModal(null);}
  function saveAcc(f){
    if(modal==="editAcc"){setAcc(as=>as.map(a=>a.id===sel.id?{...a,...f}:a));setModal(null);return;}
    setAcc(as=>[...as,{...f,id:uid(),type:"accessory",dateAdded:nowDate()}]);
    setModal(null);setSel(null);
  }
  function saveSession(f){
    if(modal==="editSession")setRangeSessions(ss=>ss.map(s=>s.id===sel.id?{...s,...f}:s));
    else{
      setRangeSessions(ss=>[...ss,{...f,id:uid(),dateAdded:nowDate()}]);
      // deduct ammo
      if(f.ammoId&&f.roundsFired){setAmmo(as=>as.map(a=>a.id==f.ammoId?{...a,quantity:Math.max(0,(parseInt(a.quantity)||0)-(parseInt(f.roundsFired)||0))}:a));}
      // add rounds to gun
      if(f.gunId&&f.roundsFired){setGuns(gs=>gs.map(g=>g.id==f.gunId?{...g,roundCount:(g.roundCount||0)+(parseInt(f.roundsFired)||0)}:g));}
    }
    setModal(null);setSel(null);
  }

  function del(){
    const t=sel.type;
    if(t==="firearm"){setGuns(gs=>gs.filter(g=>g.id!==sel.id));setAcc(as=>as.map(a=>a.gunId===sel.id?{...a,gunId:null}:a));}
    else if(t==="ammo")setAmmo(as=>as.filter(a=>a.id!==sel.id));
    else if(t==="accessory")setAcc(as=>as.filter(a=>a.id!==sel.id));
    else if(t==="session")setRangeSessions(ss=>ss.filter(s=>s.id!==sel.id));
    else if(t==="zero")setZeros(zs=>zs.filter(z=>z.id!==sel.id));
    else if(t==="maint")setMaintenance(ms=>ms.filter(m=>m.id!==sel.id));
    else if(t==="load")setLoads(ls=>ls.filter(l=>l.id!==sel.id));
    else if(t==="hunt")setHunts(hs=>hs.filter(h=>h.id!==sel.id));

  function exportPDF(guns,ammo,acc){
    const date=new Date().toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"});
    const tG=guns.reduce((s,g)=>s+(parseFloat(g.purchasePrice)||0),0);
    const tA=ammo.reduce((s,a)=>s+(parseFloat(a.purchasePrice)||0),0);
    const tAc=acc.reduce((s,a)=>s+(parseFloat(a.purchasePrice)||0),0);
    const tR=ammo.reduce((s,a)=>s+(parseInt(a.quantity)||0),0);
    const fr=(l,v)=>v?`<tr><td style="padding:6px 12px;color:#888;width:36%;border-bottom:1px solid #f0f0f0;font-size:12px;font-weight:500">${l}</td><td style="padding:6px 12px;color:#111;font-weight:600;border-bottom:1px solid #f0f0f0;font-size:12px">${v}</td></tr>`:"";
    const card=(title,tag,rows,note)=>`<div style="background:#fafafa;border:1px solid #e5e5ea;border-radius:12px;overflow:hidden;break-inside:avoid;margin-bottom:12px"><div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#fff;border-bottom:1px solid #f0f0f0"><b style="font-size:13px">${title}</b><span style="font-size:9px;font-weight:700;text-transform:uppercase;background:#1c1c1e;color:#ff9f0a;padding:2px 8px;border-radius:20px">${tag}</span></div><table style="width:100%;border-collapse:collapse">${rows}</table>${note?`<div style="padding:8px 12px;font-size:11px;color:#888;border-top:1px solid #f0f0f0">${note}</div>`:""}</div>`;
    const gCards=guns.map(g=>{const ga=acc.filter(a=>a.gunId===g.id);return card(`${g.manufacturer} ${g.model||""}`,g.caliber,[fr("Gun Type",g.gunType),fr("Action",g.action),fr("Serial #",g.serialNumber),fr("Finish",g.finish),fr("Purchased",g.purchaseDate),fr("Price",g.purchasePrice?fmtP(g.purchasePrice):"")].join(""),ga.length?`Accessories: ${ga.map(a=>`${a.category}: ${a.manufacturer} ${a.model}`).join(", ")}`:null);}).join("");
    const aCards=ammo.map(a=>card(`${a.manufacturer} ${a.caliber}`,a.ammoType||"Ammo",[fr("Grain",a.grains?`${a.grains}gr`:""),fr("Type",a.ammoType),fr("Quantity",a.quantity?`${a.quantity} rds`:""),fr("Purchased",a.purchaseDate),fr("Price",a.purchasePrice?fmtP(a.purchasePrice):"")].join(""),a.notes||null)).join("");
    const acCards=acc.map(a=>{const g=guns.find(x=>x.id===a.gunId);return card(`${a.manufacturer} ${a.model||""}`,a.category||"Accessory",[fr("Assigned To",g?gLabel(g):"Unassigned"),fr("Serial #",a.serialNumber),fr("Purchased",a.purchaseDate),fr("Price",a.purchasePrice?fmtP(a.purchasePrice):"")].join(""),a.notes||null);}).join("");
    const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Collection of the 2nd</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,Helvetica,Arial,sans-serif;padding:36px;background:#fff;color:#111}h2{font-size:14px;font-weight:700;margin:0 0 12px;padding-bottom:6px;border-bottom:2px solid #ff9f0a}section{margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}@media print{.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body>
    <div style="border-bottom:3px solid #ff9f0a;padding-bottom:12px;margin-bottom:18px"><div style="font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#ff9f0a">Collection of the 2nd</div><div style="font-size:24px;font-weight:800;margin:3px 0">Inventory Report</div><div style="font-size:12px;color:#888">Generated ${date}</div></div>
    <div style="display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap">${[["Firearms",guns.length],["Ammo Types",ammo.length],["Accessories",acc.length],["Total Rounds",tR>=1000?(tR/1000).toFixed(1)+"k":tR],["Total Invested","$"+(tG+tA+tAc).toFixed(0)]].map(([l,v])=>`<div style="background:#f5f5f7;border-radius:10px;padding:10px 14px"><div style="font-size:18px;font-weight:800;color:#ff9f0a">${v}</div><div style="font-size:9px;font-weight:700;color:#888;text-transform:uppercase;margin-top:2px">${l}</div></div>`).join("")}</div>
    ${guns.length?`<section><h2>Firearms (${guns.length})</h2><div class="grid">${gCards}</div></section>`:""}
    ${ammo.length?`<section><h2>Ammunition (${ammo.length})</h2><div class="grid">${aCards}</div></section>`:""}
    ${acc.length?`<section><h2>Accessories (${acc.length})</h2><div class="grid">${acCards}</div></section>`:""}
    <div style="margin-top:20px;padding-top:12px;border-top:1px solid #e5e5ea;font-size:10px;color:#aaa;text-align:center">Collection of the 2nd &middot; ${date}</div>
    </body></html>`;
    const w=window.open("","_blank","width=900,height=700");
    if(!w){alert("Allow popups to export PDF.");return;}
    w.document.write(html);w.document.close();w.setTimeout(()=>{w.focus();w.print();},700);
  }

  function exportCSV(){
    const esc=v=>`"${String(v??"").replace(/"/g,'""')}"`;
    const h=["Type","Manufacturer","Model","Caliber","Serial","Date","Price","Qty","Notes"].map(esc).join(",");
    const gr=guns.map(g=>["Firearm",g.manufacturer,g.model||"",g.caliber||"",g.serialNumber||"",g.purchaseDate||"",g.purchasePrice?fmtP(g.purchasePrice):"","",g.notes||""].map(esc).join(","));
    const ar=ammo.map(a=>["Ammo",a.manufacturer,a.caliber||"",a.caliber||"","",a.purchaseDate||"",a.purchasePrice?fmtP(a.purchasePrice):"",a.quantity||"",a.notes||""].map(esc).join(","));
    const acr=acc.map(a=>{const g=guns.find(x=>x.id===a.gunId);return["Accessory",a.manufacturer,a.model||"",a.category||"",a.serialNumber||"",a.purchaseDate||"",a.purchasePrice?fmtP(a.purchasePrice):"","",`Assigned: ${g?gLabel(g):"Unassigned"} ${a.notes||""}`].map(esc).join(",");});
    const blob=new Blob([[h,...gr,...ar,...acr].join("\n")],{type:"text/csv"});
    const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download="collection_of_the_2nd.csv";a.click();URL.revokeObjectURL(u);
  }

      {(showAdd||showExport)&&<div onClick={()=>{setShowAdd(false);setShowExport(false);}} style={{position:"fixed",inset:0,zIndex:290}}/>}

      {/* Modals */}
      {modal==="addGun"      &&<GunForm onSave={saveGun} onClose={()=>setModal(null)} lists={lists}/>}
      {modal==="editGun"     &&sel&&<GunForm initial={sel} onSave={saveGun} onClose={()=>setModal(null)} lists={lists}/>}
      {modal==="addAmmo"     &&<AmmoForm onSave={saveAmmo} onClose={()=>setModal(null)} lists={lists}/>}
      {modal==="editAmmo"    &&sel&&<AmmoForm initial={sel} onSave={saveAmmo} onClose={()=>setModal(null)} lists={lists}/>}
      {modal==="addAcc"      &&<AccForm onSave={saveAcc} onClose={()=>setModal(null)} guns={guns} lists={lists}/>}
      {modal==="editAcc"     &&sel&&<AccForm initial={sel} onSave={saveAcc} onClose={()=>setModal(null)} guns={guns} lists={lists}/>}
      {modal==="addSession"  &&<RangeSessionForm onSave={saveSession} onClose={()=>setModal(null)} guns={guns} ammo={ammo}/>}
      {modal==="addZero"     &&<ZeroForm onSave={saveZero} onClose={()=>setModal(null)} guns={guns} ammo={ammo}/>}
      {modal==="addMaint"    &&<MaintenanceForm onSave={saveMaint} onClose={()=>setModal(null)} guns={guns}/>}
      {modal==="addHunt"     &&<HuntForm onSave={saveHunt} onClose={()=>setModal(null)} guns={guns} ammo={ammo}/>}
      {modal==="addLoad"     &&<LoadForm onSave={saveLoad} onClose={()=>setModal(null)} lists={lists}/>}
      {modal==="editLoad"    &&sel&&<LoadForm initial={sel} onSave={saveLoad} onClose={()=>setModal(null)} lists={lists}/>}
      {modal==="editHunt"    &&sel&&<HuntForm initial={sel} onSave={saveHunt} onClose={()=>setModal(null)} guns={guns} ammo={ammo}/>}

      {modal==="detailAmmo"&&sel&&(
        <Overlay onClose={()=>{setModal(null);setSel(null);}}>
          <SheetHeader title="Ammunition" onBack={()=>{setModal(null);setSel(null);}} onDelete={del} onSave={()=>setModal("editAmmo")} saveLabel="Edit"/>
          <div style={{padding:"20px 28px 28px"}}>
            <div style={{fontSize:24,fontWeight:800,color:"#fff",marginBottom:6}}>{sel.manufacturer} {sel.caliber}</div>
            <div style={{color:"#ff9f0a",fontSize:14,fontWeight:600,marginBottom:16}}>{sel.caliber}</div>
            <div style={{background:"#2c2c2e",borderRadius:14,overflow:"hidden",marginBottom:14}}>
              {sel.grains&&<DR label="Grain" value={`${sel.grains}gr`}/>}
              {sel.ammoType&&<DR label="Type" value={sel.ammoType}/>}
              {sel.quantity&&<DR label="Quantity" value={`${sel.quantity} rounds`}/>}
              {sel.purchaseDate&&<DR label="Purchased" value={sel.purchaseDate}/>}
              {sel.purchasePrice&&<DR label="Price Paid" value={fmtP(sel.purchasePrice)} last accent/>}
            </div>
            {sel.notes&&<div style={{background:"#2c2c2e",borderRadius:14,padding:"14px"}}><div style={{color:"#8e8e93",fontSize:11,fontWeight:600,textTransform:"uppercase",marginBottom:5}}>Notes</div><div style={{color:"#fff",fontSize:14}}>{sel.notes}</div></div>}
          </div>
        </Overlay>
      )}

      {modal==="detailAcc"&&sel&&(
        <Overlay onClose={()=>{setModal(null);setSel(null);}}>
          <SheetHeader title="Accessory" onBack={()=>{setModal(null);setSel(null);}} onDelete={del} onSave={()=>setModal("editAcc")} saveLabel="Edit"/>
          <div style={{padding:"20px 28px 28px"}}>
            <div style={{fontSize:24,fontWeight:800,color:"#fff",marginBottom:6}}>{sel.manufacturer} {sel.model||""}</div>
            {sel.category&&<div style={{marginBottom:14}}><AccBadge category={sel.category}/></div>}
            {(()=>{const g=guns.find(x=>x.id===sel.gunId);return(
              <div onClick={g?()=>{setSel(g);setModal("gunProfile");}:undefined} style={{background:g?"#1e1e2e":"#2c2c2e",border:`1px solid ${g?"#bf5af244":"#3a3a3c"}`,borderRadius:14,padding:"14px",marginBottom:14,cursor:g?"pointer":"default",display:"flex",alignItems:"center",gap:10}}>
                <div style={{color:g?"#bf5af2":"#48484a"}}>{g?<ILink/>:<IUnlink/>}</div>
                <div style={{flex:1}}>
                  <div style={{color:"#8e8e93",fontSize:11,fontWeight:600,textTransform:"uppercase",marginBottom:3}}>Assigned To</div>
                  <div style={{color:g?"#fff":"#48484a",fontSize:14,fontWeight:g?600:400}}>{g?gLabel(g):"Unassigned"}</div>
                </div>
                {g&&<div style={{color:"#48484a"}}><IChev/></div>}
              </div>
            );})()}
            <div style={{background:"#2c2c2e",borderRadius:14,overflow:"hidden",marginBottom:14}}>
              {sel.serialNumber&&<DR label="Serial #" value={sel.serialNumber}/>}
              {sel.purchaseDate&&<DR label="Purchased" value={sel.purchaseDate}/>}
              {sel.purchasePrice&&<DR label="Price Paid" value={fmtP(sel.purchasePrice)} last accent/>}
            </div>
            {sel.notes&&<div style={{background:"#2c2c2e",borderRadius:14,padding:"14px"}}><div style={{color:"#8e8e93",fontSize:11,fontWeight:600,textTransform:"uppercase",marginBottom:5}}>Notes</div><div style={{color:"#fff",fontSize:14}}>{sel.notes}</div></div>}
          </div>
        </Overlay>
      )}

      {modal==="gunProfile"&&sel&&(
        <GunProfile
          gun={sel} accessories={acc} rangeSessions={rangeSessions} zeros={zeros} maintenance={maintenance} loads={loads} hunts={hunts} ammo={ammo} guns={guns} settings={settings} lists={lists}
          onClose={()=>{setModal(null);setSel(null);}}
          onEdit={()=>setModal("editGun")}
          onDelete={del}
          onAddAcc={()=>{setSel(prev=>({_fromGun:prev,_pg:prev.id,...prev}));setModal("addAcc");}}
          onViewAcc={a=>{setSel(a);setModal("detailAcc");}}
          onAddZero={()=>{const g=sel;setModal("addZero");setSel(g);}}
          onAddSession={()=>{const g=sel;setModal("addSession");setSel(g);}}
          onAddMaint={()=>{const g=sel;setModal("addMaint");setSel(g);}}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
